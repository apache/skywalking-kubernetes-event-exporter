name: Check

on:
  pull_request:

concurrency:
  group: sw-k8s-event-exporter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for non-document changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: .github/file-filters.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: 1.25

      - name: Check License
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0

      - name: Lint
        if: steps.changes.outputs.src == 'true'
        run: make lint

      - name: Unit tests
        if: steps.changes.outputs.src == 'true'
        run: make test

      - name: Build
        run: make build

      - name: Build Docker Image
        run: VERSION=test HUB=apache make -C build/package/docker

      - name: E2E tests
        if: steps.changes.outputs.src == 'true'
        uses: apache/skywalking-infra-e2e@56ac8befeb5f910f2dc9339e65d07cd18953f90e
        with:
          e2e-file: $GITHUB_WORKSPACE/test/e2e/e2e.yaml

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - run: echo "Just to make the check statuses passed"
    needs:
      - build-and-test
